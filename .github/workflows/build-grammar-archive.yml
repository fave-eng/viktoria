name: Build Viktoria grammar archive

on:
  push:
    branches:
      - grammar-archive-textbook

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate grammar files
        shell: bash
        run: |
          set -euo pipefail
          test -f deliverables/grammar/grammar-topic.html
          test -f deliverables/grammar/data/grammar-topic-present-simple-continuous.js
          test -f deliverables/grammar/data/grammar-topic-present-simple-continuous.css
          test -f deliverables/grammar/data/grammar-topic-present-simple-continuous.html
          node --check deliverables/grammar/data/grammar-topic-present-simple-continuous.js

      - uses: actions/upload-artifact@v4
        with:
          name: Viktoria-Grammar-Textbook-Style
          path: |
            deliverables/grammar/grammar-topic.html
            deliverables/grammar/data/grammar-topic-present-simple-continuous.js
            deliverables/grammar/data/grammar-topic-present-simple-continuous.css
            deliverables/grammar/data/grammar-topic-present-simple-continuous.html
          if-no-files-found: error
          retention-days: 7
