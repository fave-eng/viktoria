name: Export Viktoria grammar archive

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/export-viktoria-grammar.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build grammar archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/data
          cp grammar-topic.html export/
          cp data/grammar-data.js export/data/
          cp app.js export/
          cd export
          zip -r ../Viktoria-Grammar-Textbook-Style.zip .

      - name: Upload grammar archive
        uses: actions/upload-artifact@v4
        with:
          name: Viktoria-Grammar-Textbook-Style
          path: Viktoria-Grammar-Textbook-Style.zip
          if-no-files-found: error
          retention-days: 7
